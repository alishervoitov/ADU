name: 📬 Notify Telegram on Git Events

on:
  push:
    branches:
      - '**'
  pull_request:
    types:
      - opened
      - closed

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: 📤 Send Telegram notification on push
        if: github.event_name == 'push'
        run: |
          GITHUB_MESSAGE=$(echo "${{ github.event.head_commit.message }}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          MESSAGE=$(cat <<EOF
🚀 <b>New Push to GitHub!</b>

📂 Repo: <a href="https://github.com/${{ github.repository }}">${{ github.repository }}</a><br>
🌿 <b>Branch:</b> <code>${{ github.ref_name }}</code><br>
🔖 <b>Commit:</b> <code>${{ github.sha }}</code><br>
📝 <b>Message:</b> ${GITHUB_MESSAGE}<br>
👤 <b>Pushed by:</b> <code>${{ github.actor }}</code><br><br>

📅 <i>Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")</i>
EOF
)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$MESSAGE" \
            -d parse_mode=HTML

      - name: 📝 Send Telegram notification on PR opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        run: |
          MESSAGE=$(cat <<EOF
🔧 <b>New Pull Request Opened!</b>

📂 Repo: <a href="https://github.com/${{ github.repository }}">${{ github.repository }}</a><br>
🔀 <b>From:</b> <code>${{ github.head_ref }}</code><br>
➡️ <b>To:</b> <code>${{ github.base_ref }}</code><br>
👤 <b>Opened by:</b> <code>${{ github.actor }}</code><br>
🔗 <a href="${{ github.event.pull_request.html_url }}">View Pull Request</a><br><br>

📅 <i>Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")</i>
EOF
)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$MESSAGE" \
            -d parse_mode=HTML

      - name: ✅ Send Telegram notification on merge to main
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'main'
        run: |
          MESSAGE=$(cat <<EOF
🎉 <b>Pull Request Merged Successfully!</b>

📂 Repo: <a href="https://github.com/${{ github.repository }}">${{ github.repository }}</a><br>
🌿 <b>Merged into:</b> <code>${{ github.base_ref }}</code><br>
🔀 <b>From:</b> <code>${{ github.head_ref }}</code><br>
👤 <b>Merged by:</b> <code>${{ github.actor }}</code><br>
🔗 <a href="${{ github.event.pull_request.html_url }}">View Pull Request</a><br><br>

📅 <i>Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")</i>
EOF
)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$MESSAGE" \
            -d parse_mode=HTML
