name: Notify Telegram on Git Events

on:
  push:
    branches:
      - '**' 
  pull_request:
    types:
      - opened
      - closed

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification on push
        if: github.event_name == 'push'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="📌 *Push event*
          Branch: \`${{ github.ref_name }}\`
          Commit: \`${{ github.sha }}\`
          Message: _${{ github.event.head_commit.message }}_
          Pushed by: \`${{ github.actor }}\`" \
          -d parse_mode=Markdown

      - name: Send Telegram notification on PR opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="📣 *Pull Request opened!*
          From: \`${{ github.head_ref }}\`
          To: \`${{ github.base_ref }}\`
          By: \`${{ github.actor }}\`
          [PR Link](${{ github.event.pull_request.html_url }})" \
          -d parse_mode=Markdown

      - name: Send Telegram notification on merge to main
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'main'
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="🎉 *Pull Request Merged!*
          Merged to: \`${{ github.base_ref }}\`
          From: \`${{ github.head_ref }}\`
          By: \`${{ github.actor }}\`
          [View PR](${{ github.event.pull_request.html_url }})" \
          -d parse_mode=Markdown
