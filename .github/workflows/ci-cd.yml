name: Test and Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

env:
  SSH_PORT: 22

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements/develop.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/develop.txt
          pip install coverage

      - name: Set up test environment
        run: |
          echo "DJANGO_SETTINGS_MODULE=core.settings.test" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite:///test.db" >> $GITHUB_ENV
          echo "SECRET_KEY=SOME_SECRET_KEY_QATTU" >> $GITHUB_ENV
          echo "DEBUG=1" >> $GITHUB_ENV

      # - name: Run Django tests with coverage
      #   run: |
      #     coverage run manage.py test
      #     coverage report --fail-under=20

      - name: Send test failure notification to Telegram
        if: failure()
        run: |
          MESSAGE="❌ <b>Tests failed! Deployment cancelled.</b>%0A%0A📂 <b>Repo:</b> <a href=\"https://github.com/${{ github.repository }}\">${{ github.repository }}</a>%0A🌿 <b>Branch:</b> <code>${{ github.ref_name }}</code>%0A🔖 <b>Commit:</b> <code>${{ github.sha }}</code>%0A👤 <b>Author:</b> <code>${{ github.actor }}</code>%0A%0APlease check the <a href=\"https://github.com/${{ github.repository }}/actions\">GitHub Actions logs</a> for details.%0A📅 <i>Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")</i>"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            set -ex

            echo "🚀 Starting deployment..."

            cd /var/www/adu

            git remote set-url origin https://${{ github.repository_owner }}:${{ secrets.TOKEN_GITHUB }}@github.com/${{ github.repository }}.git

            echo "🔄 Pulling latest changes..."
            git fetch --all
            git reset --hard origin/main
            git pull origin main

            REQUIREMENTS_CHANGED=true

            source venv/bin/activate
            if [ "$REQUIREMENTS_CHANGED" = true ]; then
              echo "📦 Installing/updating dependencies..."
              pip install -r requirements/develop.txt
            fi

            echo "🗄️ Running migrations..."
            python manage.py migrate --noinput

            echo "📁 Collecting static files..."
            python manage.py collectstatic --noinput

            echo "🔄 Restarting service..."
            sudo systemctl restart adu_back

            echo "✅ Checking service status..."
            sleep 5
            sudo systemctl is-active --quiet adu_back && \
              echo "✅ Service is running successfully" || \
              { echo "❌ Service failed to start"; sudo systemctl status adu_back; exit 1; }

            echo "✅ Deployment completed successfully!"

      - name: Notify Telegram - Successful Deployment
        if: success()
        run: |
          SAFE_MSG=$(echo "${{ github.event.head_commit.message }}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          MESSAGE="✅ <b>Deployment successful!</b>%0A%0A📂 <b>Repo:</b> <a href=\"https://github.com/${{ github.repository }}\">${{ github.repository }}</a>%0A🚀 <b>Branch:</b> <code>${{ github.ref_name }}</code>%0A🔖 <b>Commit:</b> <code>${{ github.sha }}</code>%0A📝 <b>Message:</b> ${SAFE_MSG}%0A👤 <b>Author:</b> <code>${{ github.actor }}</code>%0A📊 <b>Coverage Report:</b> <a href=\"https://report.1vs1.uz\">View Report</a>%0A%0A📅 <i>Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")</i>"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML"

      - name: Notify Telegram - Failed Deployment
        if: failure()
        run: |
          MESSAGE="❌ <b>Deployment FAILED!</b>%0A%0A📂 <b>Repo:</b> <a href=\"https://github.com/${{ github.repository }}\">${{ github.repository }}</a>%0A💥 <b>Branch:</b> <code>${{ github.ref_name }}</code>%0A📝 <b>Commit:</b> <code>${{ github.sha }}</code>%0A👤 <b>Author:</b> <code>${{ github.actor }}</code>%0A🔍 Check <a href=\"https://github.com/${{ github.repository }}/actions\">GitHub Actions logs</a> for details.%0A%0A📅 <i>Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")</i>"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE" \
            -d parse_mode="HTML"
