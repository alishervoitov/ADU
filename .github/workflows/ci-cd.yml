name: Test and Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

env:
  SSH_PORT: 22

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements/develop.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/develop.txt
          pip install coverage

      - name: Set up test environment
        run: |
          # Test uchun environment o'zgaruvchilarini o'rnatish
          echo "DJANGO_SETTINGS_MODULE=core.settings.test" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite:///test.db" >> $GITHUB_ENV
          echo "SECRET_KEY=SOME_SECRET_KEY_QATTU" >> $GITHUB_ENV
          echo "DEBUG=1" >> $GITHUB_ENV

      - name: Run Django tests with coverage
        run: |
          coverage run manage.py test
          coverage report --fail-under=70

      - name: Send success notification to Telegram
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ Tests passed successfully! Deploying to server... 
          
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}"

      - name: Send test failure notification to Telegram
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Tests failed! Deployment cancelled.
          
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          
          Please check the GitHub Actions logs for details."

  deploy:
    runs-on: ubuntu-latest
    needs: test  
    if: success()  
    
    steps:
      - name: Checkout step 1
        uses: actions/checkout@v3

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /var/www/adu

            git remote set-url origin https://${{ secrets.USERNAME_GITHUB }}:${{ secrets.TOKEN_GITHUB }}@github.com/jaloliddin1006/adu.git
            
            git fetch origin main
            CHANGED_FILES=$(git diff --name-only HEAD..origin/main)
            if [[ $CHANGED_FILES == *"requirements.txt"* ]]; then
              echo "requirements.txt o'zgargan. Yangilash jarayoni boshlanadi..."
              REQUIREMENTS_CHANGED=true
            else
              echo "requirements.txt o'zgarmagan."
              REQUIREMENTS_CHANGED=false
            fi

            git pull origin main

            if [ "$REQUIREMENTS_CHANGED" = true ]; then
              /bin/bash -c "source venv/bin/activate && pip install -r requirements.txt"
            fi

            /bin/bash -c "source venv/bin/activate && python manage.py migrate --noinput"

            systemctl restart adu_back
            
            echo "✅ Deploy completed"

      - name: Notify Telegram - Successful Deployment
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="✅ *Deployment successful!* 
          Branch: \`${{ github.ref_name }}\`
          Commit: \`${{ github.sha }}\`
          Repo: [${{ github.repository }}](https://github.com/${{ github.repository }})" \
          -d parse_mode=Markdown

      - name: Notify Telegram - Failed Deployment
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="❌ *Deployment failed!* 
          Branch: \`${{ github.ref_name }}\`
          Commit: \`${{ github.sha }}\`
          Repo: [${{ github.repository }}](https://github.com/${{ github.repository }})" \
          -d parse_mode=Markdown
