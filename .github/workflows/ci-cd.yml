name: Test and Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

env:
  SSH_PORT: 22

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements/develop.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/develop.txt
          pip install coverage

      - name: Set up test environment
        run: |
          # Test uchun environment o'zgaruvchilarini o'rnatish
          echo "DJANGO_SETTINGS_MODULE=core.settings.test" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite:///test.db" >> $GITHUB_ENV
          echo "SECRET_KEY=SOME_SECRET_KEY_QATTU" >> $GITHUB_ENV
          echo "DEBUG=1" >> $GITHUB_ENV

      - name: Run Django tests with coverage
        run: |
          coverage run manage.py test
          coverage report --fail-under=20

      - name: Send test failure notification to Telegram
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Tests failed! Deployment cancelled.
          
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          
          Please check the GitHub Actions logs for details."

  deploy:
    runs-on: ubuntu-latest
    needs: test  
    if: success()  
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true  # Scriptda xatolik bo'lsa to'xtatadi
          script: |
            set -ex  # Har qanday xatolikda scriptni to'xtatadi
            
            echo "🚀 Starting deployment..."
            
            # Project direktoriyasiga o'tish
            cd /var/www/adu
            
            # Git remote URL o'rnatish  (expired: 30-oct. 2025)
            git remote set-url origin https://${{ github.repository_owner }}:${{ secrets.TOKEN_GITHUB }}@github.com/${{ github.repository }}.git
            
            echo "🔄 Pulling latest changes..."
            git fetch --all
            git reset --hard origin/main 
            git pull origin main

            # TODO:  requirements ni ichidagilari o'zgargan o'zgarmaganligini tekshirish kerak
            # CHANGED_FILES=$(git diff --name-only HEAD^ HEAD -- requirements/)
            # if [ -n "$CHANGED_FILES" ]; then
            #   echo "📦 Requirements changed (files: $CHANGED_FILES). Will update dependencies..."
            #   REQUIREMENTS_CHANGED=true
            # else
            #   echo "📦 Requirements unchanged."
            #   REQUIREMENTS_CHANGED=false
            # fi
            REQUIREMENTS_CHANGED=true


            source venv/bin/activate
            if [ "$REQUIREMENTS_CHANGED" = true ]; then
              echo "📦 Installing/updating dependencies..."
              pip install -r requirements/develop.txt
            fi
            
            echo "🗄️ Running migrations..."
            python manage.py migrate --noinput
            
            echo "📁 Collecting static files..."
            python manage.py collectstatic --noinput
            
            # Service restart
            echo "🔄 Restarting service..."
            sudo systemctl restart adu_back
            
            # Service status tekshirish
            echo "✅ Checking service status..."
            sleep 5
            sudo systemctl is-active --quiet adu_back && \
              echo "✅ Service is running successfully" || \
              { echo "❌ Service failed to start"; sudo systemctl status adu_back; exit 1; }

            echo "✅ Deployment completed successfully!"
            
            coverage run manage.py test
            coverage report --fail-under=20
            coverage html 

      - name: Notify Telegram - Successful Deployment
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="✅ *Deployment successful!* 

          📂 Repo: [${{ github.repository }}](https://github.com/${{ github.repository }})
          
          🚀 Branch: \`${{ github.ref_name }}\`
          🔖 Commit: \`${{ github.sha }}\`
          📝 *Message:* _${{ github.event.head_commit.message }}_
          👤 Author: ${{ github.actor }}
          📊 Coverage Test Report: [View Report](https://report.1vs1.uz)

          📅 _Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")_" \
          -d parse_mode=Markdown

      - name: Notify Telegram - Failed Deployment
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="❌ *Deployment FAILED!* 

          📂 Repo: [${{ github.repository }}](https://github.com/${{ github.repository }})
          
          💥 Branch: \`${{ github.ref_name }}\`
          📝 Commit: \`${{ github.sha }}\`
          👤 Author: ${{ github.actor }}
          🔍 Check [GitHub Actions logs](https://github.com/${{ github.repository }}/actions) for details.

          📅 _Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")_" \
          -d parse_mode=Markdown
