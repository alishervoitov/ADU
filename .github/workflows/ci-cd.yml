name: Test and Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

env:
  SSH_PORT: 22

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements/develop.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/develop.txt
          pip install coverage

      - name: Set up test environment
        run: |
          # Test uchun environment o'zgaruvchilarini o'rnatish
          echo "DJANGO_SETTINGS_MODULE=core.settings.test" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite:///test.db" >> $GITHUB_ENV
          echo "SECRET_KEY=SOME_SECRET_KEY_QATTU" >> $GITHUB_ENV
          echo "DEBUG=1" >> $GITHUB_ENV

      - name: Run Django tests with coverage
        run: |
          coverage run manage.py test
          coverage report --fail-under=50

      # - name: Send success notification to Telegram
      #   if: success()
      #   run: |
      #     curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
      #       -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
      #       -d text="✅ Tests passed successfully! Deploying to server... 
          
      #     Repository: ${{ github.repository }}
      #     Branch: ${{ github.ref_name }}
      #     Commit: ${{ github.sha }}
      #     Author: ${{ github.actor }}"

      - name: Send test failure notification to Telegram
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Tests failed! Deployment cancelled.
          
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          
          Please check the GitHub Actions logs for details."

  deploy:
    runs-on: ubuntu-latest
    needs: test  
    if: success()  
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true  # Scriptda xatolik bo'lsa to'xtatadi
          script: |
            set -e  # Har qanday xatolikda scriptni to'xtatadi
            
            echo "🚀 Starting deployment..."
            
            # Project direktoriyasiga o'tish
            cd /var/www/adu || { echo "❌ Project directory not found"; exit 1; }
            
            # Git remote URL o'rnatish
            git remote set-url origin https://${{ secrets.USERNAME_GITHUB }}:${{ secrets.TOKEN_GITHUB }}@github.com/jaloliddin1006/adu.git
            
            echo "📥 Fetching latest changes..."
            git fetch origin main || { echo "❌ Git fetch failed"; exit 1; }
            
            # Requirements.txt o'zgarganligini tekshirish
            CHANGED_FILES=$(git diff --name-only HEAD..origin/main)
            if [[ $CHANGED_FILES == *"requirements"* ]]; then
              echo "📦 Requirements changed. Will update dependencies..."
              REQUIREMENTS_CHANGED=true
            else
              echo "📦 Requirements unchanged."
              REQUIREMENTS_CHANGED=false
            fi
            
            # Git pull
            echo "⬇️ Pulling latest code..."
            git pull origin main || { echo "❌ Git pull failed"; exit 1; }
            
            # Virtual environment aktivatsiyasi va dependencies yangilash
            if [ "$REQUIREMENTS_CHANGED" = true ]; then
              echo "📦 Installing/updating dependencies..."
              source venv/bin/activate || { echo "❌ Virtual environment activation failed"; exit 1; }
              pip install -r requirements.txt || { echo "❌ Dependencies installation failed"; exit 1; }
            else
              echo "📦 Skipping dependencies installation"
              source venv/bin/activate || { echo "❌ Virtual environment activation failed"; exit 1; }
            fi
            
            # Database migrations
            echo "🗄️ Running migrations..."
            python manage.py migrate --noinput || { echo "❌ Migrations failed"; exit 1; }
            
            # Static files yig'ish (agar kerak bo'lsa)
            echo "📁 Collecting static files..."
            python manage.py collectstatic --noinput || { echo "❌ Static files collection failed"; exit 1; }
            
            # Service restart
            echo "🔄 Restarting service..."
            sudo systemctl restart adu_back || { echo "❌ Service restart failed"; exit 1; }
            
            # Service status tekshirish
            echo "✅ Checking service status..."
            sleep 5
            if sudo systemctl is-active --quiet adu_back; then
              echo "✅ Service is running successfully"
            else
              echo "❌ Service failed to start"
              sudo systemctl status adu_back
              exit 1
            fi
            
            echo "✅ Deployment completed successfully!"

      - name: Notify Telegram - Successful Deployment
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="✅ *Deployment successful!* 
          
          🚀 Branch: \`${{ github.ref_name }}\`
          📝 Commit: \`${{ github.sha }}\`
          👤 Author: ${{ github.actor }}
          📂 Repo: [${{ github.repository }}](https://github.com/${{ github.repository }})" \
          -d parse_mode=Markdown

      - name: Notify Telegram - Failed Deployment
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="❌ *Deployment FAILED!* 
          
          💥 Branch: \`${{ github.ref_name }}\`
          📝 Commit: \`${{ github.sha }}\`
          👤 Author: ${{ github.actor }}
          📂 Repo: [${{ github.repository }}](https://github.com/${{ github.repository }})
          
          🔍 Check [GitHub Actions logs](https://github.com/${{ github.repository }}/actions) for details." \
          -d parse_mode=Markdown
